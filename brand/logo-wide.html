<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #f7f3ec;
        --clay: #c98a6b;
        --forest: #2f3a30;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 300px; }
      body {
        background: var(--forest);
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 46px;
      }
      .word {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 92px;
        line-height: 1;
        color: var(--cream);
        letter-spacing: 0.01em;
      }
      .city {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 500;
        font-size: 30px;
        letter-spacing: 0.42em;
        color: var(--clay);
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <svg width="230" height="150" viewBox="0 0 230 150" fill="none">
      <defs>
        <clipPath id="above">
          <rect x="0" y="0" width="230" height="106" />
        </clipPath>
      </defs>
      <circle cx="115" cy="62" r="54" fill="#c98a6b" clip-path="url(#above)" />
      <rect x="18" y="106" width="194" height="9" rx="4.5" fill="#f7f3ec" />
      <rect x="50" y="129" width="130" height="7" rx="3.5" fill="#f7f3ec" opacity="0.5" />
    </svg>
    <div>
      <div class="word">Ivanna Yoga</div>
      <div class="city">LISBON</div>
    </div>
  </body>
</html>

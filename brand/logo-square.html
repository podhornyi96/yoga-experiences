<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #f7f3ec;
        --clay: #c98a6b;
        --forest: #2f3a30;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 1200px; }
      body {
        background: var(--forest);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 74px;
      }
      .mark { display: block; }
      .word {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 158px;
        line-height: 1.02;
        color: var(--cream);
        text-align: center;
        letter-spacing: 0.01em;
      }
      .city {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 500;
        font-size: 52px;
        letter-spacing: 0.42em;
        color: var(--clay);
        text-indent: 0.42em;
        margin-top: 34px;
      }
    </style>
  </head>
  <body>
    <svg class="mark" width="420" height="250" viewBox="0 0 420 250" fill="none">
      <defs>
        <clipPath id="above">
          <rect x="0" y="0" width="420" height="183" />
        </clipPath>
      </defs>
      <circle cx="210" cy="112" r="92" fill="#c98a6b" clip-path="url(#above)" />
      <rect x="40" y="182" width="340" height="13" rx="6.5" fill="#f7f3ec" />
      <rect x="96" y="222" width="228" height="11" rx="5.5" fill="#f7f3ec" opacity="0.5" />
    </svg>
    <div>
      <div class="word">Ivanna<br />Yoga</div>
      <div class="city">LISBON</div>
    </div>
  </body>
</html>

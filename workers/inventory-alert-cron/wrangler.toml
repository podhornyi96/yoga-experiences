# Thin companion Worker: hourly cron → Pages cron APIs
# (low-inventory + booking-reminders).
# Pages Functions cannot attach Cron Triggers; this Worker only fetches the APIs.

name = "yoga-inventory-alert-cron"
main = "src/index.ts"
compatibility_date = "2025-03-01"
workers_dev = false

[triggers]
crons = ["0 * * * *"]

# Override in dashboard / secrets if needed. CRON_SECRET must match Pages.
[vars]
SITE_URL = "https://ivanna-yoga.com"
